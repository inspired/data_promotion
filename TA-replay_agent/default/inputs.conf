# Replay agent: polls the Search Head for jobs and stages matching files.
[script://./bin/replay_agent.py]
interval = 30
passAuth = splunk-system-user
python.version = python3
index = _internal
sourcetype = replay:agent
disabled = 0

# Staged files are read once and then DELETED (sinkhole). Only the agent writes here.
# Each job gets its own subdirectory; crcSalt makes re-replays of identical content work.
[batch://$SPLUNK_HOME/var/replay/staging]
move_policy = sinkhole
sourcetype = replay:hec
crcSalt = <SOURCE>
whitelist = \.ndjson$
disabled = 0
