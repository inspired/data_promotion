# Promotion agent settings. Override in local/promotion_agent.conf.
# NOTE: no inline comments - Splunk-style conf; keep comments on their own line.

[agent]
# filesystem | s3
backend = filesystem

# Root of the Ingest Actions file system destination (filesystem backend).
# Expected layout: <root>/year=YYYY/month=MM/day=DD/sourcetype=<st>/events_*.ndjson[.gz]
fs_root = /dumps/splunk9.4-filesystemout

# S3 backend: s3://bucket/prefix (same layout below the prefix). Uses the AWS CLI
# and its normal credential chain (instance profile recommended).
s3_uri =
aws_cli = /usr/local/bin/aws

# work_dir and staging_dir MUST be on the same filesystem (atomic rename).
# staging_dir MUST be inside $SPLUNK_HOME/var/spool/splunk: staged *.stash_hec files are
# read (and deleted) there by Splunk's built-in [batch://...stash_hec] input.
work_dir = $SPLUNK_HOME/var/promotion/work
staging_dir = $SPLUNK_HOME/var/spool/splunk/promotion

# Files are hourly partitions named events_<latest>_<earliest>_... Files whose range
# is within this many seconds of the requested window are also scanned, to catch
# late-arriving events. Every event is still filtered by its own "time" field.
file_slack_seconds = 3600

# Most bytes of edge archive files (as stored, often .gz) one agent reads for one job.
# A job over this limit fails on this agent before anything is read. Default 50 GiB.
max_bytes_per_job = 53687091200
# Free disk space always left on the work / staging file system. Checked before every file
# and every 64 MiB written; a task that would go below it waits or fails. Default 10 GiB.
min_free_bytes = 10737418240

# Back-pressure. Staged events are uncompressed, and the stash_hec input reads them only as
# fast as the forwarder can send. Before staging the next file, the agent waits while more
# than max_staged_bytes (all jobs together) are staged and not yet read. Default 2 GiB.
max_staged_bytes = 2147483648
# Fail the task if the staged data has not shrunk for this many seconds while waiting.
staging_stall_seconds = 1800
staging_poll_seconds = 5

# Seconds between catalog publishes to the Search Head KV store.
catalog_interval = 900

# Field sampling, done with the catalog: read the first sample_lines events of the
# sample_files newest files of every sourcetype and publish the indexes, hosts, sources
# and indexed field names seen there (promotion_fields). Event text and field values are
# never published. A sourcetype is read again only when its newest files change.
# sample_files = 0 turns sampling off.
sample_files = 3
sample_lines = 200
# S3 backend: read at most this many bytes of each sampled object (ranged GET).
sample_bytes = 1048576
# Keep at most this many hosts / sources / field names per sourcetype.
sample_max_values = 100

# Add indexed field promote_job=<job id> to every promoted event.
tag_events = true

# Seconds between registration heartbeats to the Search Head (promotion_agents)
heartbeat_interval = 300
# This agent's task records older than this are removed from the Search Head
task_retention_days = 30

log_level = INFO

[control]
# Search Head (or SHC member / KV store host) management URI that holds promotion_control.
# Leave empty (or use 127.0.0.1 / localhost) on an all-in-one instance: the agent then
# uses its own session key and the token / credential settings below are not used.
sh_uri =
app = promotion_control
verify_ssl = true
# Optional CA bundle for verifying the Search Head certificate.
ca_file =
# This HF's own management URI (used to read the stored token).
local_uri = https://127.0.0.1:8089
# storage/passwords entry holding a Splunk auth token for the Search Head.
credential_realm = promotion_agent
credential_name = sh_token
request_timeout = 60
