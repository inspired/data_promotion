# Promotion agent: polls the Search Head for jobs and stages matching files.
[script://./bin/promotion_agent.py]
interval = 30
passAuth = splunk-system-user
python.version = python3
index = _internal
sourcetype = promotion:agent
disabled = 0

# Staged files are read once and then DELETED (sinkhole). Only the agent writes here.
# Each job gets its own subdirectory; crcSalt makes repeated promotions of identical content work.
[batch://$SPLUNK_HOME/var/promotion/staging]
move_policy = sinkhole
sourcetype = promotion:hec
crcSalt = <SOURCE>
whitelist = \.ndjson$
disabled = 0
