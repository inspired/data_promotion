# Promotion agent: polls the Search Head for jobs and stages matching files.
[script://./bin/promotion_agent.py]
interval = 30
passAuth = splunk-system-user
python.version = python3
index = _internal
sourcetype = promotion:agent
disabled = 0

# Staged files are read by Splunk's built-in input (etc/system/default/inputs.conf):
#   [batch://$SPLUNK_HOME/var/spool/splunk/...stash_hec]  sourcetype = stash_hec, sinkhole
# with [stash_hec] INDEXED_EXTRACTIONS = hec in props.conf. This app adds no input for them.
