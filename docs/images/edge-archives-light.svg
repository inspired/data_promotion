<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="430" viewBox="0 0 1220 430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Data Promotion: edge archives at thousands of sites</title>
<desc id="d">Central Splunk holds the Search Head with the Data Promotion page, its KV store and the indexers. At each of thousands of remote sites a Heavy Forwarder writes a full copy of its data to an edge archive with Ingest Actions. Through the TA-promotion_agent add-on every forwarder reports to the KV store and, only when a job asks for it, sends the selected events from its own archive to the indexers.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F1F4F9"/></linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#E1E6EE"/></pattern>
<radialGradient id="glow" cx="0.82" cy="0.62" r="0.5"><stop offset="0" stop-color="#0B6FA4" stop-opacity="0.18"/><stop offset="1" stop-color="#0B6FA4" stop-opacity="0"/></radialGradient>
</defs>
