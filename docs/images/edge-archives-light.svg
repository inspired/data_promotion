<g transform="translate(820,56)"><rect width="360" height="64" rx="12" fill="#FFFFFF" stroke="#D5DBE5"/><rect x="12" y="12" width="5" height="40" rx="2.5" fill="#2E7D32"/><text x="28" y="30" font-size="15" font-weight="700" fill="#0F172A">Indexers</text><text x="28" y="50" font-size="12.5" fill="#4B5565">promoted events carry <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">promote_job=&lt;id&gt;</tspan></text></g>
