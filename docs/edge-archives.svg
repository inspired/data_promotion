<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Edge archives at remote sites</title>
  <desc id="d">Remote sites each keep an edge archive: the Ingest Actions file system or S3 output of their Heavy Forwarders. The forwarder that wrote each archive reports what it holds to the central Search Head and, when a job asks for it, sends the selected events to the indexers.</desc>
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc4f2"/>
      <stop offset="1" stop-color="#2b7bbf"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fa3e0"/>
      <stop offset="1" stop-color="#16568f"/>
    </linearGradient>
    <marker id="arrData" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f6fb2"/>
    </marker>
    <marker id="arrCtl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrDown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1000" height="660" rx="16" fill="#f8fafc"/>

  <!-- central site -->
  <rect x="170" y="24" width="660" height="186" rx="14" fill="#eef2f7" stroke="#cbd5e1"/>
  <text x="190" y="50" font-size="13" font-weight="700" fill="#334155" letter-spacing="0.5">CENTRAL SPLUNK</text>

  <!-- search head -->
  <rect x="196" y="64" width="280" height="122" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="214" y="90" font-size="16" font-weight="700" fill="#0f172a">Search Head</text>
  <text x="214" y="109" font-size="12" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">promotion_control</text>
  <text x="214" y="134" font-size="12.5" fill="#1e293b">• Data Promotion page</text>
  <text x="214" y="153" font-size="12.5" fill="#1e293b">• KV store: jobs, catalog, forwarders, tasks</text>
  <text x="214" y="172" font-size="12.5" fill="#1e293b">• Tracks every job until indexed</text>

  <!-- indexers / data lake -->
  <rect x="524" y="64" width="280" height="122" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="542" y="90" font-size="16" font-weight="700" fill="#0f172a">Indexers</text>
  <text x="542" y="109" font-size="12" fill="#475569">the data lake: searchable data</text>
  <ellipse cx="664" cy="148" rx="118" ry="24" fill="url(#lake)"/>
  <path d="M560,150 q8,-5 16,0 t16,0" fill="none" stroke="#cfe8fb" stroke-width="1.6" opacity="0.8"/>
  <path d="M738,146 q8,-5 16,0 t16,0" fill="none" stroke="#cfe8fb" stroke-width="1.6" opacity="0.8"/>
  <text x="664" y="152" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">promote_job=&lt;id&gt;</text>

  <!-- connections: control (dashed) to the Search Head, promoted events (solid) to the indexers -->
  <g fill="none" stroke-width="2">
    <path d="M150,372 C150,290 290,260 300,190" stroke="#6b7280" stroke-dasharray="6 5" marker-start="url(#arrCtl)" marker-end="url(#arrCtl)"/>
    <path d="M470,372 C470,290 380,260 370,190" stroke="#6b7280" stroke-dasharray="6 5" marker-start="url(#arrCtl)" marker-end="url(#arrCtl)"/>
    <path d="M790,372 C790,270 460,280 440,190" stroke="#6b7280" stroke-dasharray="6 5" marker-start="url(#arrCtl)" marker-end="url(#arrCtl)"/>

    <path d="M210,372 C210,290 560,280 580,190" stroke="#1f6fb2" marker-end="url(#arrData)"/>
    <path d="M530,372 C530,300 650,260 660,190" stroke="#1f6fb2" marker-end="url(#arrData)"/>
    <path d="M850,372 C850,290 750,260 740,190" stroke="#1f6fb2" marker-end="url(#arrData)"/>
  </g>

  <!-- ===== Site A ===== -->
  <g transform="translate(30,340)">
    <rect x="0" y="0" width="280" height="250" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="4 3"/>
    <text x="16" y="22" font-size="12" font-weight="700" fill="#64748b" letter-spacing="0.5">REMOTE SITE A · PLANT</text>
    <rect x="20" y="32" width="240" height="58" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="34" y="54" font-size="13.5" font-weight="700" fill="#0f172a">Heavy Forwarder</text>
    <text x="34" y="72" font-size="11.5" fill="#475569">Ingest Actions + <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">TA-promotion_agent</tspan></text>
    <line x1="140" y1="90" x2="140" y2="128" stroke="#374151" stroke-width="2" marker-end="url(#arrDown)"/>
    <text x="150" y="114" font-size="11" fill="#475569">full copy</text>
    <rect x="50" y="140" width="180" height="72" rx="10" fill="url(#water)"/>
    <text x="140" y="173" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Edge archive</text>
    <text x="140" y="191" font-size="11" fill="#eaf6ff" text-anchor="middle">local disk</text>
    <text x="140" y="236" font-size="10.5" fill="#64748b" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">year=/month=/day=/sourcetype=/</text>
  </g>

  <!-- ===== Site B ===== -->
  <g transform="translate(360,340)">
    <rect x="0" y="0" width="280" height="250" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="4 3"/>
    <text x="16" y="22" font-size="12" font-weight="700" fill="#64748b" letter-spacing="0.5">REMOTE SITE B · BRANCH</text>
    <rect x="20" y="32" width="240" height="58" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="34" y="54" font-size="13.5" font-weight="700" fill="#0f172a">Heavy Forwarder</text>
    <text x="34" y="72" font-size="11.5" fill="#475569">Ingest Actions + <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">TA-promotion_agent</tspan></text>
    <line x1="140" y1="90" x2="140" y2="128" stroke="#374151" stroke-width="2" marker-end="url(#arrDown)"/>
    <text x="150" y="114" font-size="11" fill="#475569">full copy</text>
    <rect x="50" y="142" width="180" height="72" rx="10" fill="url(#water)"/>
    <text x="140" y="175" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Edge archive</text>
    <text x="140" y="193" font-size="11" fill="#eaf6ff" text-anchor="middle">NFS share</text>
    <text x="140" y="236" font-size="10.5" fill="#64748b" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">events_&lt;t&gt;_&lt;t&gt;_…_&lt;GUID&gt;.ndjson</text>
  </g>

  <!-- ===== Site C ===== -->
  <g transform="translate(690,340)">
    <rect x="0" y="0" width="280" height="250" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="4 3"/>
    <text x="16" y="22" font-size="12" font-weight="700" fill="#64748b" letter-spacing="0.5">REMOTE SITE C · CLOUD REGION</text>
    <rect x="20" y="32" width="240" height="58" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="34" y="54" font-size="13.5" font-weight="700" fill="#0f172a">Heavy Forwarder</text>
    <text x="34" y="72" font-size="11.5" fill="#475569">Ingest Actions + <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">TA-promotion_agent</tspan></text>
    <line x1="140" y1="90" x2="140" y2="128" stroke="#374151" stroke-width="2" marker-end="url(#arrDown)"/>
    <text x="150" y="114" font-size="11" fill="#475569">full copy</text>
    <rect x="50" y="140" width="180" height="72" rx="10" fill="url(#water)"/>
    <text x="140" y="173" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Edge archive</text>
    <text x="140" y="191" font-size="11" fill="#eaf6ff" text-anchor="middle">S3 bucket</text>
    <text x="140" y="236" font-size="10.5" fill="#64748b" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">s3://bucket/prefix/year=…</text>
  </g>

  <!-- legend -->
  <g transform="translate(30,616)" font-size="12.5" fill="#334155">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="50" y="4">heartbeat, catalog and jobs (REST to the Search Head KV store)</text>
    <line x1="470" y1="0" x2="510" y2="0" stroke="#1f6fb2" stroke-width="2" marker-end="url(#arrData)"/>
    <text x="520" y="4">promoted events, on demand (stash_hec → outputs)</text>
  </g>
</svg>
