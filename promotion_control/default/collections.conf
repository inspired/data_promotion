# Job queue. Written by the promote_submit / promote_cancel macros and the page (cancel).
# Agents only read it; "Promotion - Track indexing" rolls promotion_tasks up into it.
[promotion_jobs]
field.job_id = string
field.sourcetype = string
field.index_filter = string
# Destination index; empty = each event's original index. Must exist on the indexers.
field.target_index = string
# Space-separated writer GUIDs, or * for all forwarders.
field.forwarders = string
field.forwarders_count = number
# Agents holding matching data when the job was submitted, and their task roll-up.
field.agents_expected = number
field.agents_reported = number
field.agents_running = number
field.agents_failed = number
field.agents_cancelled = number
field.earliest = number
field.latest = number
field.status = string
field.submitted_by = string
field.submitted_at = number
field.started_at = number
field.finished_at = number
field.agent_host = string
field.files_total = number
field.files_done = number
field.bytes_read = number
field.events_staged = number
field.events_skipped = number
field.events_bad = number
field.events_indexed = number
field.completed_at = number
field.message = string
accelerated_fields.status = {"status": 1}

# What exists on disk / S3, one row per agent + sourcetype + UTC day. Published by each agent.
[promotion_catalog]
field.agent = string
field.sourcetype = string
field.day = string
field.files = number
field.bytes = number
field.earliest = number
field.latest = number
field.backend = string
field.forwarders = number
field.updated_at = number

# One row per agent + writing forwarder (server GUID in the filenames). Published by each agent.
[promotion_sources]
field.agent = string
field.agent_host = string
field.guid = string
field.sourcetypes = array
field.days = number
field.files = number
field.bytes = number
field.earliest = number
field.latest = number
field.backend = string
field.updated_at = number

# What the sourcetypes contain, one row per agent + sourcetype (key <agent>|<sourcetype>).
# Sampled by each agent from the first events of its newest files: envelope values and
# indexed field names only, never event text or field values. Arrays are most frequent first.
[promotion_fields]
field.agent = string
field.sourcetype = string
field.indexes = array
field.hosts = array
field.sources = array
field.indexed_fields = array
field.hosts_truncated = bool
field.sources_truncated = bool
field.fields_truncated = bool
field.events_sampled = number
field.files_sampled = number
field.sampled_at = number
field.updated_at = number
accelerated_fields.sourcetype = {"sourcetype": 1}

# One row per agent and job (key <job id>|<agent GUID>). Written only by that agent.
[promotion_tasks]
field.job_id = string
field.agent = string
field.agent_host = string
field.status = string
field.files_total = number
field.files_done = number
field.bytes_read = number
field.events_staged = number
field.events_skipped = number
field.events_bad = number
field.started_at = number
field.finished_at = number
field.updated_at = number
field.message = string
accelerated_fields.job = {"job_id": 1}
accelerated_fields.agent = {"agent": 1, "status": 1}

# Promotion agents (key = server GUID). Each agent registers itself and sends a heartbeat.
[promotion_agents]
field.guid = string
field.hostname = string
field.splunk_version = string
field.agent_version = string
field.os = string
field.backend = string
field.output = string
field.forwarders = number
field.files = number
field.bytes = number
field.sourcetypes = array
field.last_seen = number
field.catalog_at = number

# GUID -> hostname for forwarders without an agent (shared store), from indexer metrics.
[promotion_forwarder_names]
field.guid = string
field.hostname = string
field.fwd_type = string
field.version = string
field.ip = string
field.last_seen = number
field.name_source = string
field.updated_at = number
