# Data Promotion REST API: /services/data_promotion/...
# Used by the Data Promotion page, SOAR and scripts. See docs/api.md.
# Every request needs the promote_data capability (authorize.conf).
[script:data_promotion]
match = /data_promotion
scripttype = persist
# Persistent handlers need both: the file in bin/ and module.Class in it.
script = promotion_rest.py
handler = promotion_rest.PromotionRest
python.version = python3
output_modes = json
requireAuthentication = true
capability = promote_data
passSystemAuth = true
passSession = true
passPayload = true
passHttpHeaders = false
passHttpCookies = false
