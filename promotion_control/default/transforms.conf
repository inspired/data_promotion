[promotion_jobs]
external_type = kvstore
collection = promotion_jobs
fields_list = _key, job_id, sourcetype, index_filter, target_index, forwarders, forwarders_count, agents_expected, agents_reported, agents_running, agents_failed, agents_cancelled, earliest, latest, status, submitted_by, submitted_at, started_at, finished_at, agent_host, files_total, files_done, bytes_read, events_staged, events_skipped, events_bad, events_indexed, completed_at, message

[promotion_catalog]
external_type = kvstore
collection = promotion_catalog
fields_list = _key, agent, sourcetype, day, files, bytes, earliest, latest, backend, forwarders, updated_at

[promotion_sources]
external_type = kvstore
collection = promotion_sources
fields_list = _key, agent, agent_host, guid, sourcetypes, days, files, bytes, earliest, latest, backend, updated_at

[promotion_fields]
external_type = kvstore
collection = promotion_fields
fields_list = _key, agent, sourcetype, indexes, hosts, sources, indexed_fields, hosts_truncated, sources_truncated, fields_truncated, events_sampled, files_sampled, sampled_at, updated_at

[promotion_forwarder_names]
external_type = kvstore
collection = promotion_forwarder_names
fields_list = _key, guid, hostname, fwd_type, version, ip, last_seen, name_source, updated_at

[promotion_tasks]
external_type = kvstore
collection = promotion_tasks
fields_list = _key, job_id, agent, agent_host, status, files_total, files_done, bytes_read, events_staged, events_skipped, events_bad, started_at, finished_at, updated_at, message

[promotion_agents]
external_type = kvstore
collection = promotion_agents
fields_list = _key, guid, hostname, splunk_version, agent_version, os, backend, output, forwarders, files, bytes, sourcetypes, last_seen, catalog_at, max_bytes_per_job
