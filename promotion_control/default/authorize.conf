# Lets a user call the Data Promotion API (/services/data_promotion), which the page uses.
[capability::promote_data]

# Grant to people who may look at and submit promotions.
[role_promotion_user]
importRoles = user
promote_data = enabled

# Service account role for the forwarders (TA-promotion_agent): reads jobs and writes its
# tasks, catalog, sources, sampled fields and heartbeat to the KV store. Nothing else.
[role_promotion_agent]

[role_admin]
promote_data = enabled
