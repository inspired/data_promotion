# Job queue. Written by the replay_submit / replay_cancel macros, read and updated
# by the replay agent on the dedicated replay Heavy Forwarder.
[replay_jobs]
field.job_id = string
field.sourcetype = string
field.index_filter = string
field.earliest = number
field.latest = number
field.status = string
field.submitted_by = string
field.submitted_at = number
field.started_at = number
field.finished_at = number
field.agent_host = string
field.files_total = number
field.files_done = number
field.bytes_read = number
field.events_staged = number
field.events_skipped = number
field.events_bad = number
field.events_indexed = number
field.completed_at = number
field.message = string
accelerated_fields.status = {"status": 1}

# What exists on disk / S3, one row per sourcetype + UTC day. Published by the agent.
[replay_catalog]
field.sourcetype = string
field.day = string
field.files = number
field.bytes = number
field.earliest = number
field.latest = number
field.backend = string
field.updated_at = number
