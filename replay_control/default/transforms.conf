[replay_jobs]
external_type = kvstore
collection = replay_jobs
fields_list = _key, job_id, sourcetype, index_filter, earliest, latest, status, submitted_by, submitted_at, started_at, finished_at, agent_host, files_total, files_done, bytes_read, events_staged, events_skipped, events_bad, events_indexed, completed_at, message

[replay_catalog]
external_type = kvstore
collection = replay_catalog
fields_list = _key, sourcetype, day, files, bytes, earliest, latest, backend, updated_at
