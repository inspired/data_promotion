# Moves replay jobs from "staged" to "completed" once every staged event is searchable.
# The replay HF only stages files; this search on the Search Head checks the indexed
# field replay_job=<job id> and compares it with events_staged.
#   staged / indexing -> completed   when events_indexed >= events_staged
#   staged / indexing -> incomplete  when not complete 30 min after staging
# Jobs are re-checked for 24h after staging, so a slow pipeline can still complete.
[Replay - Track indexing]
description = Updates replay_jobs status from staged to completed / incomplete by counting indexed events per replay_job.
enableSched = 1
cron_schedule = */2 * * * *
schedule_window = 1
dispatch.earliest_time = 0
dispatch.latest_time = now
is_visible = 1
search = | inputlookup replay_jobs where (status="staged" OR status="indexing" OR status="incomplete") \
| where now() - coalesce(finished_at, submitted_at) < 86400 \
| eval jkey=_key \
| join type=left max=0 job_id \
    [| tstats count AS events_indexed where (index=* OR index=_*) replay_job=* \
        [| inputlookup replay_jobs where (status="staged" OR status="indexing" OR status="incomplete") \
        | stats min(earliest) AS e max(latest) AS l count \
        | eval search="earliest=".coalesce(floor(e), 0)." latest=".coalesce(ceiling(l) + 1, 1) \
        | fields search] \
        by replay_job \
    | rename replay_job AS job_id] \
| fillnull value=0 events_indexed events_staged \
| eval age=now() - coalesce(finished_at, submitted_at) \
| eval status=case(events_indexed>=events_staged, "completed", age>1800, "incomplete", true(), "indexing") \
| eval completed_at=if(status="completed", coalesce(completed_at, now()), null()) \
| eval message=case(events_staged=0, "no matching events in the selected range", status="completed", events_indexed." of ".events_staged." events indexed", status="incomplete", "only ".events_indexed." of ".events_staged." events indexed after ".round(age/60)." min", true(), events_indexed." of ".events_staged." events indexed so far") \
| eval _key=jkey \
| fields - jkey age \
| outputlookup append=true replay_jobs
