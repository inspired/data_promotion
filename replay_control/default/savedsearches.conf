# Rolls the agents' task records (replay_tasks) up into each job, then checks indexing.
# Agents only write their own task; this search on the Search Head owns the job status.
#   pending   -> running    when the first agent reports
#   running   -> staged     when every expected agent finished (or none updated for 30 min)
#   staged / indexing -> completed   when every staged event is searchable (replay_job=<id>)
#                     -> incomplete  agents failed / did not report, or still short 30 min
#                                    after staging (re-checked for 24h)
#   cancel_requested -> cancelled    when no agent is still running
#   pending   -> failed     when no agent picked the job up within 30 min
[Replay - Track indexing]
description = Rolls replay_tasks up into replay_jobs and moves jobs to completed / incomplete by counting indexed events per replay_job.
enableSched = 1
cron_schedule = * * * * *
schedule_window = 1
dispatch.earliest_time = 0
dispatch.latest_time = now
is_visible = 1
search = | inputlookup replay_jobs where (status="pending" OR status="running" OR status="cancel_requested" OR status="staged" OR status="indexing" OR status="incomplete") \
| where status="pending" OR status="running" OR status="cancel_requested" OR now() - coalesce(finished_at, submitted_at) < 86400 \
| eval jkey=_key, agents_expected=coalesce(agents_expected, 1) \
| join type=left max=1 job_id \
    [| inputlookup replay_tasks \
    | where updated_at > now() - 2592000 \
    | stats count AS agents_reported count(eval(status="running")) AS agents_running count(eval(status="failed")) AS agents_failed count(eval(status="cancelled")) AS agents_cancelled sum(files_total) AS files_total sum(files_done) AS files_done sum(bytes_read) AS bytes_read sum(events_staged) AS events_staged sum(events_skipped) AS events_skipped sum(events_bad) AS events_bad min(started_at) AS started_at max(finished_at) AS t_finished max(updated_at) AS t_updated values(eval(if(status="failed", agent_host.": ".message, null()))) AS errors by job_id] \
| eval has_tasks=if(isnotnull(t_updated), 1, 0) \
| fillnull value=0 agents_reported agents_running agents_failed agents_cancelled \
| eval n_done=agents_reported - agents_running, since_submit=now() - submitted_at, since_update=now() - coalesce(t_updated, submitted_at), active=if(status="pending" OR status="running", 1, 0) \
| eval status=case(status="cancel_requested" AND agents_running=0, "cancelled", status="cancel_requested", status, active=1 AND agents_reported=0 AND since_submit>1800, "failed", active=1 AND agents_reported=0, "pending", active=1 AND n_done<agents_expected AND (agents_running>0 OR since_update<1800), "running", active=1 AND agents_failed>=agents_reported, "failed", active=1, "staged", true(), status) \
| eval finished_at=if(status="staged" OR status="cancelled" OR (active=1 AND status="failed"), coalesce(t_finished, now()), finished_at) \
| join type=left max=0 job_id \
    [| tstats count AS events_indexed where (index=* OR index=_*) replay_job=* \
        [| inputlookup replay_jobs where (status="running" OR status="staged" OR status="indexing" OR status="incomplete") \
        | stats min(earliest) AS e max(latest) AS l count \
        | eval search="earliest=".coalesce(floor(e), 0)." latest=".coalesce(ceiling(l) + 1, 1) \
        | fields search] \
        by replay_job \
    | rename replay_job AS job_id] \
| fillnull value=0 events_indexed events_staged \
| eval missing=if(has_tasks=1 AND agents_expected > agents_reported, agents_expected - agents_reported, 0), problems=agents_failed + missing \
| eval problem_text=trim(if(agents_failed>0, agents_failed." forwarder(s) failed (".mvindex(errors, 0)."); ", "").if(missing>0, missing." forwarder(s) did not report", "")) \
| eval age=now() - coalesce(finished_at, submitted_at) \
| eval indexing=if(status="staged" OR status="indexing" OR status="incomplete", 1, 0) \
| eval status=if(indexing=1, case(events_indexed>=events_staged AND problems=0, "completed", events_indexed>=events_staged, "incomplete", age>1800, "incomplete", true(), "indexing"), status) \
| eval completed_at=if(status="completed", coalesce(completed_at, now()), null()) \
| eval message=case(status="pending", "waiting for forwarders", status="running", n_done." of ".agents_expected." forwarders finished", status="cancel_requested", agents_running." forwarder(s) still stopping", status="cancelled", "cancelled; events already handed over will still be indexed", status="failed" AND agents_reported=0, "no forwarder picked up this job within 30 min", status="failed", coalesce(mvindex(errors, 0), message), events_staged=0 AND problems=0, "no matching events in the selected range", status="completed", events_indexed." of ".events_staged." events indexed", status="incomplete" AND problems>0, events_indexed." of ".events_staged." events indexed; ".problem_text, status="incomplete", "only ".events_indexed." of ".events_staged." events indexed after ".round(age/60)." min", true(), events_indexed." of ".events_staged." events indexed so far") \
| eval _key=jkey \
| fields - jkey has_tasks n_done since_submit since_update active t_finished t_updated errors missing problems problem_text age indexing \
| outputlookup append=true replay_jobs

# Fallback names for writer GUIDs that have no agent of their own (for example HFs that
# write to a shared store read by one replay HF). Agents report their own name in
# replay_agents, which the page prefers. Source: forwarder connections seen by the
# indexers (tcpin_connections). Rows are upserted by GUID, so names are kept.
[Replay - Forwarder names]
description = Maintains replay_forwarder_names (server GUID -> hostname) for the Data Replay page.
enableSched = 1
cron_schedule = 7 * * * *
schedule_window = 10
dispatch.earliest_time = -4h
dispatch.latest_time = now
is_visible = 1
search = index=_internal source=*metrics.log* group=tcpin_connections guid=* \
| stats latest(hostname) AS hostname latest(fwdType) AS fwd_type latest(version) AS version latest(sourceIp) AS ip max(_time) AS last_seen by guid \
| eval name_source="tcpin_connections" \
| eval guid=upper(guid) \
| eval _key=guid, last_seen=floor(last_seen), updated_at=now() \
| table _key guid hostname fwd_type version ip last_seen name_source updated_at \
| outputlookup append=true replay_forwarder_names
