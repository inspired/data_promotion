# Submit a replay job using the search's time range picker.
# Usage (args unquoted):  | `replay_submit(splunkd, *, *, *)`
#   arg 1: sourcetype as it appears in the catalog (sourcetype=<dir> partition name)
#   arg 2: index filter, wildcard allowed; * = all indexes in the files
#   arg 3: forwarders: * for all, or space-separated server GUIDs of the writing HFs
#   arg 4: destination index: * = each event's original index. The index must already
#          exist on the indexers (it cannot be checked from here).
[replay_submit(4)]
args = sourcetype, index_filter, forwarders, target_index
definition = makeresults \
| addinfo \
| eval job_id=strftime(now(), "%Y%m%d-%H%M%S")."-".substr(md5(tostring(random())), 1, 6) \
| eval _key=job_id, sourcetype=trim("$sourcetype$"), index_filter=trim("$index_filter$"), forwarders=upper(trim("$forwarders$")), target_index=trim("$target_index$") \
| eval target_index=if(target_index="" OR target_index="*", null(), target_index) \
| eval index_filter=if(index_filter="", "*", index_filter), forwarders=if(forwarders="", "*", forwarders) \
| eval forwarders_count=if(forwarders="*", 0, mvcount(split(forwarders, " "))) \
| eval earliest=floor(tonumber(info_min_time)), lt=tonumber(info_max_time) \
| eval latest=ceiling(if(isnull(lt) OR lt>now(), now(), lt)) \
| eval submitted_at=now() \
| appendcols [| rest splunk_server=local /services/authentication/current-context | fields username] \
| appendcols [| inputlookup replay_sources | search agent=* sourcetypes="$sourcetype$" | eval sel=upper(trim("$forwarders$")) | where sel="*" OR sel="" OR isnotnull(mvfind(split(sel, " "), "^".guid."$")) | stats dc(agent) AS agents_expected] \
| eval submitted_by=username, agents_expected=coalesce(agents_expected, 0) \
| eval message=case(sourcetype="" OR sourcetype="*", "sourcetype is required", like(sourcetype, "%/%") OR like(sourcetype, "%..%"), "invalid sourcetype", forwarders!="*" AND NOT match(forwarders, "^[0-9A-F -]+$"), "invalid agent GUIDs", isnotnull(target_index) AND NOT match(target_index, "^[a-z0-9_][a-z0-9_-]{0,79}$"), "invalid destination index", isnull(earliest) OR earliest<=0, "a bounded time range is required (not All time)", latest<=earliest, "latest must be after earliest", agents_expected=0, "no agent holds data for this sourcetype", true(), null()) \
| eval status=if(isnull(message), "pending", "rejected") \
| table _key job_id sourcetype index_filter target_index forwarders forwarders_count agents_expected earliest latest status submitted_by submitted_at message \
| outputlookup append=true replay_jobs \
| eval earliest=strftime(earliest, "%F %T %z"), latest=strftime(latest, "%F %T %z") \
| fields - _key
iseval = 0

# Original index.
[replay_submit(3)]
args = sourcetype, index_filter, forwarders
definition = `replay_submit($sourcetype$, $index_filter$, $forwarders$, *)`
iseval = 0

# Backwards compatible: all forwarders.
[replay_submit(2)]
args = sourcetype, index_filter
definition = `replay_submit($sourcetype$, $index_filter$, *)`
iseval = 0

# Cancel a job. Pending jobs are cancelled immediately; running jobs stop on every agent
# after its current file (events already handed over will still be indexed).
# Usage: | `replay_cancel(20261123-140501-a1b2c3)`
[replay_cancel(1)]
args = job_id
definition = inputlookup replay_jobs where job_id="$job_id$" \
| where status="pending" OR status="running" \
| eval status=if(status="pending", "cancelled", "cancel_requested"), message="cancelled by user" \
| outputlookup append=true replay_jobs \
| table job_id status message
iseval = 0

# Indexed event counts for one job (compare with events_staged).
# Usage: | `replay_verify(20261123-140501-a1b2c3)`   (set time range to cover the job)
[replay_verify(1)]
args = job_id
definition = tstats count where (index=* OR index=_*) replay_job="$job_id$" by index sourcetype host
iseval = 0
